[workspace]
members = [".", "gameplay_core"]
default-members = [".", "gameplay_core"]
resolver = "2"

[package]
name = "rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { git = "https://github.com/godot-rust/gdext", rev = "dd3684eb17188c06fad6d94f2d7e3b54816e04f0" }
gameplay_core = { path = "gameplay_core" }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 1
